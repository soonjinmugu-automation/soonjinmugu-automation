name: 순진무구 크롤링 자동화

on:
  schedule:
    - cron: '0 21 * * *'  # UTC 21:00 = 한국시간 06:00
  workflow_dispatch:  # 수동 실행 가능

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
    - name: 코드 체크아웃
      uses: actions/checkout@v4

    - name: Python 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Chrome 설치
      uses: browser-actions/setup-chrome@latest
      with:
        chrome-version: stable

    - name: ChromeDriver 설치
      uses: nanasess/setup-chromedriver@v2

    - name: 의존성 설치
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Google 인증 파일 생성
      env:
        CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        TOKEN_PICKLE_B64: ${{ secrets.TOKEN_PICKLE_B64 }}
      run: |
        echo "$CREDENTIALS_JSON" > credentials.json
        echo "$TOKEN_PICKLE_B64" | base64 -d > token.pickle

    - name: 크롤링 실행
      env:
        CI: 'true'  # Chrome Profile 사용 안 함
      run: |
        python main.py

    - name: 로그 업로드 (실패 시)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: logs
        path: logs/
        retention-days: 7
